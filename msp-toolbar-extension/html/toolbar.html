<meta name="before-children" content="body">
<div id="msp-toolbar" class="msp-toolbar" role="toolbar" aria-label="KCM toolbar" style="display: none;">
  <div class="msp-toolbar__controls">
    <button id="msp-toolbar-home" class="msp-toolbar__button msp-toolbar__button--icon" type="button"
      aria-label="Naar dashboard">
      <svg class="msp-toolbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3.2 3.5 10v10.2h6.2v-6.1h4.6v6.1h6.2V10L12 3.2zM18.6 18.2h-2.2v-6.1H7.6v6.1H5.4v-7.2L12 5.9l6.6 5.1v7.2z"/>
      </svg>
    </button>
    <button id="msp-toolbar-menu" class="msp-toolbar__button msp-toolbar__button--icon" type="button"
      aria-label="Open menu">
      <svg class="msp-toolbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7.2h16v1.8H4V7.2zm0 5.9h16v1.8H4v-1.8zm0 5.9h16v1.8H4v-1.8z"/>
      </svg>
    </button>
    <div class="msp-toolbar__search">
      <input id="msp-toolbar-search" class="msp-toolbar__input" type="search" placeholder="Zoek verbinding..."
        aria-label="Zoek verbinding" autocomplete="off" spellcheck="false">
      <div id="msp-toolbar-results" class="msp-toolbar__results" role="listbox" hidden></div>
    </div>
  </div>
</div>
